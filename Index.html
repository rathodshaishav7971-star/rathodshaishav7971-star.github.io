<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Rose Day, Bubu 🌹</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff4b6e, #ff758c);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            padding: 35px;
            border-radius: 18px;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }
        p {
            font-size: 22px;
            line-height: 1.6;
        }
        .rose {
            font-size: 110px;
            margin-bottom: 10px;
            animation: float 2s infinite ease-in-out;
        }
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
            100% { transform: translateY(0); }
        }
        .from {
            margin-top: 25px;
            font-style: italic;
            font-size: 20px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="rose">🌹</div>
        <h1>Happy Rose Day, Bubu 🌹</h1>

        <p>
            Not everyone gets a rose,<br>
            but you deserve more than one 🌹<br><br>
            This little page is just a small way<br>
            to say you mean a lot to me 💕
        </p>

        <div class="from">— From Shaishav</div>
    </div>

</body>
</html>
